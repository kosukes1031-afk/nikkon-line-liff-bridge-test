<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>LINE認証</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}main{max-width:560px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:14px;padding:22px;box-shadow:0 1px 8px #0002}.spinner{width:34px;height:34px;border:4px solid #dce5ed;border-top-color:#087f5b;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:21px}.status{text-align:center;line-height:1.7}.error{background:#fff0ee;color:#b42318;padding:14px;border-radius:10px}
  </style>
</head>
<body>
<main><div class="card"><h1>おしごとフェスタ（検証）</h1><div id="status" class="status"><div class="spinner"></div>LINE情報を確認しています…</div></div></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
/* PoC LIFF ID only. This is a public identifier, not a credential. */
const LIFF_ID = '2009668362-3dydAR8b';
const ALLOWED_ROUTES = new Set(['home', 'companies', 'reservation', 'ticket', 'tour', 'gate']);
const GAS_URL_PATTERN = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
const PENDING_PARAMS_KEY = 'nikkon-liff-bridge-test-pending-v2';
const PENDING_PARAMS_TTL_MS = 10 * 60 * 1000;
const statusEl = document.getElementById('status');
function show(text){ statusEl.innerHTML = '<div class="spinner"></div>' + text; }
function fail(error){ statusEl.innerHTML = '<div class="error"><b>LINE認証を完了できませんでした。</b><br>' + String(error && error.message || error) + '</div>'; }
function stateParams(rawState){
  const state = String(rawState || '').trim();
  if (!state || state.length > 2048 || /^[a-z][a-z0-9+.-]*:/i.test(state) || state.startsWith('//')) return new URLSearchParams();
  try { return new URLSearchParams(state.startsWith('?') ? state.slice(1) : state); }
  catch (_) { return new URLSearchParams(); }
}
function allowedRoute(value){
  const route = String(value || '').trim().toLowerCase();
  return ALLOWED_ROUTES.has(route) ? route : 'home';
}
function allowedGasUrl(value){
  const gasUrl = String(value || '').trim();
  return GAS_URL_PATTERN.test(gasUrl) ? gasUrl : '';
}
function storedParams(){
  const stores = [sessionStorage, localStorage];
  for (const store of stores) try {
    const saved = JSON.parse(store.getItem(PENDING_PARAMS_KEY) || 'null');
    if (!saved || !Number.isFinite(saved.savedAt) || Date.now() - saved.savedAt > PENDING_PARAMS_TTL_MS) {
      store.removeItem(PENDING_PARAMS_KEY);
      continue;
    }
    const result = new URLSearchParams();
    ['gas', 'route', 'event', 'action', 'token'].forEach(function(name){
      if (typeof saved[name] === 'string' && saved[name].length <= 2048) result.set(name, saved[name]);
    });
    return result;
  } catch (_) {
    store.removeItem(PENDING_PARAMS_KEY);
  }
  try {
    const prefix = PENDING_PARAMS_KEY + '=';
    const raw = String(document.cookie || '').split(';').map(function(part){ return part.trim(); }).find(function(part){ return part.startsWith(prefix); });
    const saved = raw ? JSON.parse(decodeURIComponent(raw.slice(prefix.length))) : null;
    if (saved && Number.isFinite(saved.savedAt) && Date.now() - saved.savedAt <= PENDING_PARAMS_TTL_MS) {
      const result = new URLSearchParams();
      ['gas', 'route'].forEach(function(name){
        if (typeof saved[name] === 'string' && saved[name].length <= 2048) result.set(name, saved[name]);
      });
      return result;
    }
  } catch (_) {}
  return new URLSearchParams();
}
function rememberParams(p){
  const saved = { savedAt: Date.now() };
  ['gas', 'route', 'event', 'action', 'token'].forEach(function(name){ saved[name] = p.get(name) || ''; });
  const serialized = JSON.stringify(saved);
  sessionStorage.setItem(PENDING_PARAMS_KEY, serialized);
  localStorage.setItem(PENDING_PARAMS_KEY, serialized);
  const cookieSaved = JSON.stringify({ savedAt: saved.savedAt, gas: saved.gas, route: saved.route });
  document.cookie = PENDING_PARAMS_KEY + '=' + encodeURIComponent(cookieSaved) + '; Max-Age=600; Path=/nikkon-line-liff-bridge-test/; SameSite=Lax; Secure';
}
function clearStoredParams(){
  sessionStorage.removeItem(PENDING_PARAMS_KEY);
  localStorage.removeItem(PENDING_PARAMS_KEY);
  document.cookie = PENDING_PARAMS_KEY + '=; Max-Age=0; Path=/nikkon-line-liff-bridge-test/; SameSite=Lax; Secure';
}
function loginRedirectUrl(p){
  const redirect = new URL(location.origin + location.pathname);
  ['gas', 'route', 'event', 'action', 'token'].forEach(function(name){
    const value = p.get(name);
    if (value) redirect.searchParams.set(name, value);
  });
  return redirect.href;
}
function params(){
  const url = new URL(location.href);
  const direct = new URLSearchParams(url.search);
  const nested = stateParams(direct.get('liff.state'));
  const stored = storedParams();
  const merged = new URLSearchParams(direct);
  ['gas', 'event', 'action', 'token'].forEach(function(name){
    if (!merged.has(name) && nested.has(name)) merged.set(name, nested.get(name));
    if (!merged.has(name) && stored.has(name)) merged.set(name, stored.get(name));
  });
  const directRoute = direct.get('route') || direct.get('page');
  const nestedRoute = nested.get('route') || nested.get('page');
  const storedRoute = stored.get('route');
  merged.set('route', allowedRoute(directRoute != null ? directRoute : (nestedRoute != null ? nestedRoute : storedRoute)));
  return merged;
}
function addField(form, name, value){ const input=document.createElement('input'); input.type='hidden'; input.name=name; input.value=value||''; form.appendChild(input); }
async function start(){
  try {
    const p = params();
    const gasUrl = allowedGasUrl(p.get('gas'));
    if (!gasUrl) throw new Error('検証用GAS URLが指定されていません。');
    p.set('gas', gasUrl);
    p.set('route', allowedRoute(p.get('route')));
    rememberParams(p);
    show('LINEへ接続しています…');
    await liff.init({liffId:LIFF_ID, withLoginOnExternalBrowser:true});
    if (!liff.isLoggedIn()) {
      liff.login({redirectUri:loginRedirectUrl(p)});
      return;
    }
    const idToken = liff.getIDToken();
    if (!idToken) throw new Error('LINE本人確認情報を取得できませんでした。');
    show('認証できました。参加者画面を開いています…');
    const form=document.createElement('form'); form.method='POST'; form.action=gasUrl;
    addField(form,'bridgeAction','liffBridge'); addField(form,'idToken',idToken);
    addField(form,'route',p.get('route')||'home');
    addField(form,'event',p.get('event')||''); addField(form,'routeAction',p.get('action')||''); addField(form,'token',p.get('token')||'');
    document.body.appendChild(form); form.submit();
    clearStoredParams();
  } catch (error) { fail(error); }
}
start();
</script>
</body>
</html>
